name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the version rust-toolchain.toml pins)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
