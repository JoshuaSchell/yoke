<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Placeholder app icon: the rune ᚱ (raido, "R") on a dark squircle, on Apple's 1024 grid
       (824 pt tile, 100 pt margin) so it sits right beside other Dock icons. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c31"/>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="260" x2="0" y2="766">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#d9d3c6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <g transform="translate(-60 0)">
  <g fill="none" stroke="url(#glyph)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round">
    <path d="M414 292 V732"/>
    <path d="M414 292 L598 402 L414 512 L610 732"/>
  </g>
  <!-- A prompt cursor, for "code". -->
  <rect x="672" y="698" width="92" height="40" rx="12" fill="#f5a742"/>
  </g>
</svg>
