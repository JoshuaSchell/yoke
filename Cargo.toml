[package]
name = "yoke"
version = "0.1.10"
edition = "2024"
description = "A small T3 Code-style desktop app for prompting coding agents (Claude Code, Codex, OpenCode), built on Rune."
publish = false

[dependencies]
# Rune, from our fork (github.com/JoshuaSchell/rune, branch `rune-code`: upstream `dev` plus
# our changes; upstream takes issues, not PRs). Pinned to a commit so every build gets the
# same Rune. To change Rune: commit and push on the fork's `rune-code` branch, then bump `rev`.
# Locally, `.cargo/config.toml` (not committed) swaps in the clone at ../rune. The
# `[patch.crates-io]` table below must name the same rev.
rune = { git = "https://github.com/JoshuaSchell/rune", rev = "23919fee658ae39651d92cfd73174b4325729310", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/JoshuaSchell/rune", rev = "23919fee658ae39651d92cfd73174b4325729310", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/JoshuaSchell/rune", rev = "23919fee658ae39651d92cfd73174b4325729310" }
rune-notify = { git = "https://github.com/JoshuaSchell/rune", rev = "23919fee658ae39651d92cfd73174b4325729310" }
serde_json = "1"
base64 = "0.22"
# Local dates for the usage page (days, "resets 9:20 PM").
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Updates the installed app from GitHub Releases (src/updater.rs): a signed Yoke.app.tar.gz
# and latest.json beside the .dmg, which .github/workflows/release.yml makes.
cargo-packager-updater = "0.2"

# Rune builds a few crates as published plus its own patches (vendor/ in the Rune repo). A
# dependency's `[patch]` doesn't reach the workspace that depends on it, so Yoke repeats Rune's
# root `[patch.crates-io]` table, from the same rev; without winit's, Rune doesn't compile on
# macOS. When a Rune bump adds an entry there, add it here too.
[patch.crates-io]
winit = { git = "https://github.com/JoshuaSchell/rune", rev = "23919fee658ae39651d92cfd73174b4325729310" }
parley_engine = { git = "https://github.com/JoshuaSchell/rune", rev = "23919fee658ae39651d92cfd73174b4325729310" }
wgpu-hal = { git = "https://github.com/JoshuaSchell/rune", rev = "23919fee658ae39651d92cfd73174b4325729310" }
accesskit_windows = { git = "https://github.com/JoshuaSchell/rune", rev = "23919fee658ae39651d92cfd73174b4325729310" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Menu bar fixups Rune doesn't do yet, and the Dock badge (src/ui/mac.rs). Same versions Rune uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSDockTile", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSThread"] }

# Installers: `cargo packager --release` builds Yoke.app and a .dmg on macOS, an NSIS
# installer on Windows, and a .deb and .AppImage on Linux, into target/release/.
# assets/Yoke.icon (Icon Composer) is the source; icon.icns, icon.png, icon-256.png and icon.ico are rendered
# from it (scripts/icons.sh).
[package.metadata.packager]
product-name = "Yoke"
identifier = "dev.yoke"
category = "DeveloperTool"
icons = ["assets/icon.icns", "assets/icon.png", "assets/icon.ico"]
before-packaging-command = "cargo build --release"

[package.metadata.packager.macos]
# Ad-hoc ("-"): no Apple account. Apple Silicon needs a signature to run at all; downloads
# from a browser still need a right-click › Open the first time, Homebrew and Nix installs don't.
signing-identity = "-"

# The Windows uninstaller offers to delete these too (the prefs and pasted screenshots).
[package.metadata.packager.nsis]
appdata-paths = ["$APPDATA/$IDENTIFIER", "$TEMP/yoke-pastes"]

# Dependencies build optimised even in debug, so `cargo run` is smooth.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 16
incremental = true

# For performance numbers (matches Rune's own perf profile).
[profile.perf]
inherits = "release"
incremental = false
# File and line symbols, so samply, Instruments and perf can name functions. Doesn't change
# the generated code, only the binary's size.
debug = "line-tables-only"
